function dateKey(date = new Date()) {
  const parts = new Intl.DateTimeFormat("en-US", {
    timeZone:"Asia/Seoul",
    year:"numeric",
    month:"2-digit",
    day:"2-digit"
  }).formatToParts(date);
  const get = type => parts.find(p => p.type === type).value;
  return get("year") + "-" + get("month") + "-" + get("day");
}

function dailyQuestion() {
  const days = Math.floor(
    Date.parse(dateKey() + "T00:00:00Z") / 86400000
  );
  return questions[days % questions.length];
}

// 사진 크기 줄여서 업로드
$("photoInput").onchange = async function () {
  const file = this.files[0];
  if (!file) return;

  const img = new Image();
  const url = URL.createObjectURL(file);

  img.onload = () => {
    const canvas = document.createElement("canvas");
    const scale = Math.min(1,1000/img.width,1000/img.height);
    canvas.width = Math.round(img.width * scale);
    canvas.height = Math.round(img.height * scale);
    canvas.getContext("2d").drawImage(
      img,0,0,canvas.width,canvas.height
    );
    selectedPhoto = canvas.toDataURL("image/jpeg",0.7);
    const preview = new Image();
    preview.src = selectedPhoto;
    $("preview").replaceChildren(preview);
    URL.revokeObjectURL(url);
  };
  img.onerror = () => {
    notify("사진을 열 수 없어.");
    URL.revokeObjectURL(url);
  };
  img.src = url;
};

async function uploadPhoto(data) {
  if (!data) return null;
  const blob = await (await fetch(data)).blob();
  if (blob.size > 3145728) throw Error("사진 용량 초과");

  const path = uid + "/" + crypto.randomUUID() + ".jpg";
  const result = await db.storage.from("pieces-photos")
    .upload(path,blob,{contentType:"image/jpeg"});

  if (result.error) throw result.error;
  return path;
}

  $("submit").disabled = true;

  try {
    const photo_path = await uploadPhoto(selectedPhoto);
    const result = await db.from("pieces_entries").insert({
      author_id:uid,
      display_name:$("nickname").value.trim() || "익명의 마음",
      mood:$("mood").value,
      body,
      photo_path
    });

    if (result.error) throw result.error;

    $("message").value = "";
    $("photoInput").value = "";
    $("preview").textContent = "📷 사진 선택";
    selectedPhoto = "";

    await load();
    show("home");
    notify("오늘의 조각을 남겼어 🌿");

  } catch (e) {
    console.error(e);
    notify("저장에 실패했어. 글은 입력창에 남아 있어.");
  } finally {
    $("submit").disabled = false;
  }
}

// 앨범 카드
function makeCard(post) {
  const card = document.createElement("article");
  card.className = "memory";

  if (post.photo_path) {
    const img = document.createElement("img");
    img.loading = "lazy";
    img.alt = "추억 사진";
    img.src = db.storage.from("pieces-photos")
      .getPublicUrl(post.photo_path).data.publicUrl;
    card.append(img);
  } else {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = post.mood;
    card.append(empty);
  }

  const date = document.createElement("p");
  date.className = "muted";
  date.textContent =
    new Date(post.created_at).toLocaleDateString("ko-KR")
    + " · " + post.display_name;
  card.append(date);

  const mood = document.createElement("h3");
  mood.textContent = post.mood;
  card.append(mood);

  const text = document.createElement("p");
  text.textContent = post.body;
  card.append(text);

  const actions = document.createElement("div");
  actions.className = "actions";

  // 하트
  const heart = document.createElement("button");
  heart.className = "soft";
  const liked = likes.some(
    x => x.entry_id === post.id && x.user_id === uid
  );
  heart.textContent = (liked ? "💗" : "🤍") + " 마음 " +
    ((post.legacy_hearts || 0) +
     likes.filter(x => x.entry_id === post.id).length);

  heart.onclick = async () => {
    heart.disabled = true;
    const result = liked
      ? await db.from("pieces_likes").delete()
          .eq("entry_id",post.id).eq("user_id",uid)
      : await db.from("pieces_likes").insert({
          entry_id:post.id,user_id:uid
        });

    if (result.error) notify("하트 저장 실패");
    heart.disabled = false;
    await load();
  };
  actions.append(heart);

  // 글 삭제: 작성자 또는 관리자만
  if (post.author_id === uid || isAdmin) {
    const del = document.createElement("button");
    del.className = "soft";
    del.textContent = "🗑 글 삭제";
    del.onclick = async () => {
      if (!confirm("사진·글·댓글·하트를 삭제할까?")) return;
      del.disabled = true;

      const result = await db.from("pieces_entries")
        .delete().eq("id",post.id).select("id");

      if (result.error || !result.data?.length) {
        notify("삭제 권한을 확인해 줘.");
      } else {
        if (post.photo_path) {
          const photoResult = await db.storage
            .from("pieces-photos").remove([post.photo_path]);
          if (photoResult.error) {
            notify("글은 삭제됐지만 사진 원본 삭제는 실패했어.");
          }
        }
        await load();
        notify("글을 삭제했어.");
      }
      del.disabled = false;
    };
    actions.append(del);
  }
  card.append(actions);

  const box = document.createElement("div");

  // 이전 기록의 댓글
  (post.legacy_comments || []).forEach(value => {
    const p = document.createElement("p");
    p.textContent = "💬 " + value;
    box.append(p);
  });

  // 새 댓글과 삭제
  comments.filter(c => c.entry_id === post.id).forEach(c => {
    const line = document.createElement("div");
    line.className = "actions";

    const text = document.createElement("span");
    text.textContent = "💬 " + c.body;
    line.append(text);

    if (c.author_id === uid || isAdmin) {
      const del = document.createElement("button");
      del.className = "soft";
      del.textContent = "삭제";

      del.onclick = async () => {
        if (!confirm("댓글을 삭제할까?")) return;
        const result = await db.from("pieces_comments")
          .delete().eq("id",c.id).select("id");

        if (result.error || !result.data?.length) {
          notify("댓글 삭제 실패");
        } else {
          await load();
        }
      };
      line.append(del);
    }
    box.append(line);
  });

  const input = document.createElement("input");
  input.placeholder = "짧은 답장 남기기";
  input.maxLength = 200;

  const reply = document.createElement("button");
  reply.className = "soft";
  reply.textContent = "답장하기";
  reply.onclick = async () => {
    if (!input.value.trim()) return;
    reply.disabled = true;

    const result = await db.from("pieces_comments").insert({
      entry_id:post.id,
      author_id:uid,
      body:input.value.trim()
    });

    if (result.error) notify("답장 저장 실패");
    reply.disabled = false;
    await load();
  };

  box.append(input,reply);
  card.append(box);
  return card;
}

function fill(id,items) {
  const root = $(id);
  root.replaceChildren();
  if (!items.length) {
    root.textContent = "아직 남겨진 조각이 없어.";
    return;
  }
  items.forEach(item => root.append(makeCard(item)));
}

function render() {
  fill("recent",memories.slice(0,4));
  const filter = $("filter").value;
  fill("gallery",memories.filter(
    x => filter === "all" || x.mood === filter
  ));
  extras();
}

// 타임캡슐과 정원
function extras() {
  $("question").textContent = dailyQuestion();

  const parts = dateKey().split("-").map(Number);
  const previousMonthEnd = new Date(
    Date.UTC(parts[0],parts[1]-1,0)
  ).getUTCDate();
  const past = new Date(Date.UTC(
    parts[0],parts[1]-2,
    Math.min(parts[2],previousMonthEnd),12
  ));

  const key = dateKey(past);
  const entries = memories.filter(
    m => dateKey(new Date(m.created_at)) === key
  );

  $("capsule").replaceChildren();
  if (entries.length) {
    entries.slice(0,3).forEach(
      m => $("capsule").append(makeCard(m))
    );
  } else {
    $("capsule").textContent =
      "한 달 전 이 날짜의 기록이 아직 없어.";
  }

  const stages = ["🌱","🌿","🪴","🌳","🌳🌼","🌳🦋","🌳🌸🦋"];
  const thresholds = [0,1,3,6,10,20,35];
  let level = 0;
  thresholds.forEach((n,i) => {
    if (memories.length >= n) level = i;
  });

  $("garden").textContent = stages[level] +
    "  함께 남긴 조각 " + memories.length + "개";
}

// 랜덤 추억
function surprise() {
  show("surprisePage");
  $("surpriseResult").replaceChildren();
  if (!memories.length) {
    $("surpriseResult").textContent = "아직 추억이 없어.";
    return;
  }
  const item = memories[
    Math.floor(Math.random()*memories.length)
  ];
  $("surpriseResult").append(makeCard(item));
}

// 감정 달력
function drawCalendar() {
  const now = new Date();
  const parts = dateKey(now).split("-").map(Number);
  const y = parts[0],m = parts[1]-1;
  $("month").textContent = y + "년 " + (m+1) + "월";
  const root = $("calendar");
  root.replaceChildren();

  ["일","월","화","수","목","금","토"].forEach(day => {
    const b = document.createElement("b");
    b.className = "day";
    b.textContent = day;
    root.append(b);
  });

  for (let i=0;i<new Date(y,m,1).getDay();i++) {
    root.append(document.createElement("div"));
  }

  const days = new Date(y,m+1,0).getDate();
  for (let d=1;d<=days;d++) {
    const key = [y,String(m+1).padStart(2,"0"),
                 String(d).padStart(2,"0")].join("-");
    const found = memories.filter(
      v => dateKey(new Date(v.created_at)) === key
    );

    const btn = document.createElement("button");
    btn.className = "day" + (found.length ? " marked" : "");
    btn.textContent = d + (found.length ? " " + found[0].mood : "");
    btn.onclick = () => {
      if (found.length) {
        show("album");
        fill("gallery",found);
      }
    };
    root.append(btn);
  }
}

// 공동 기록 불러오기
async function load() {
  const [posts,commentResult,likeResult] = await Promise.all([
    db.from("pieces_entries").select("*")
      .order("created_at",{ascending:false}).limit(1000),
    db.from("pieces_comments").select("*").limit(3000),
    db.from("pieces_likes").select("*").limit(3000)
  ]);

  if (posts.error || commentResult.error || likeResult.error) {
    console.error(posts.error || commentResult.error || likeResult.error);
    notify("공유 기록을 읽지 못했어.");
    return;
  }

  memories = posts.data;
  comments = commentResult.data;
  likes = likeResult.data;
  ready = true;

  $("status").textContent = "☁️ 실시간 공유 중 · " +
    memories.length + "개의 기록";
  render();
}

// 기존 브라우저 기록 백업
function oldRecords() {
  try {
    return JSON.parse(localStorage.getItem(OLD_KEY) || "[]");
  } catch (e) {
    return [];
  }
}
function backup() {
  const blob = new Blob(
    [localStorage.getItem(OLD_KEY) || "[]"],
    {type:"application/json"}
  );
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "오늘의조각들_기존기록.json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(url),1000);
}

// 기존 기록 공동 앨범으로 이전
async function moveOld() {
  const records = oldRecords();
  if (!confirm(records.length+"개 기록을 공동 앨범에 복사할까?")) {
    return;
  }

  let count = 0;
  for (const item of records) {
    try {
      const legacyId = String(item.id);
      const existing = await db.from("pieces_entries")
        .select("id").eq("author_id",uid)
        .eq("legacy_id",legacyId).maybeSingle();

      if (existing.error) throw existing.error;
      if (existing.data) continue;

      const photo = await uploadPhoto(item.photo || "");
      const result = await db.from("pieces_entries").insert({
        author_id:uid,
        legacy_id:legacyId,
        display_name:item.name || "익명의 마음",
        mood:item.mood || "🍀",
        body:item.text || "",
        photo_path:photo,
        created_at:item.date,
        legacy_hearts:item.hearts || 0,
        legacy_comments:item.comments || []
      });

      if (result.error) throw result.error;
      count++;
    } catch (e) {
      console.error(e);
    }
  }
  await load();
  notify(count+"개 기록을 옮겼어. 원본은 유지돼.");
}

// 푸시 수신 준비
async function enablePush() {
  notify("휴대폰 푸시를 사용하려면 VAPID 키와 Supabase 발송 서버를 연결해야 해.");
}

// 연결 시작
async function start() {
  try {
    let {data:{session},error} = await db.auth.getSession();
    if (error) throw error;

    if (!session) {
      const result = await db.auth.signInAnonymously();
      if (result.error) throw result.error;
    }

    const user = await db.auth.getUser();
    if (user.error) throw user.error;
    uid = user.data.user.id;

    const adminResult = await db.from("pieces_admins")
      .select("user_id").eq("user_id",uid).maybeSingle();
    isAdmin = Boolean(adminResult.data && !adminResult.error);

    await load();

    if (oldRecords().length) $("moveOld").hidden = false;

    db.channel("pieces-live")
      .on("postgres_changes",{
        event:"*",schema:"public",table:"pieces_entries"
      }, async event => {
        if (event.eventType === "INSERT" &&
            event.new.author_id !== uid) {
          notify("🌿 새로운 조각이 도착했어.");
        }
        await load();
      })
      .on("postgres_changes",{
        event:"*",schema:"public",table:"pieces_comments"
      },load)
      .on("postgres_changes",{
        event:"*",schema:"public",table:"pieces_likes"
      },load)
      .subscribe();

  } catch (e) {
    console.error(e);
    $("status").textContent =
      "⚠️ 공유 앨범 연결 오류. Supabase 설정을 확인해 줘.";
  }
}

start();
setInterval(() => {
  if (dateKey() !== window.lastQuestionDate) {
    window.lastQuestionDate = dateKey();
    extras();
  }
},60000);
window.lastQuestionDate = dateKey();
</script>
